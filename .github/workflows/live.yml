name: live

# Runs the live-source browser workflows against the deployed site; fails visibly when a public source changes.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: |
          export BROWSER=$(node --input-type=module -e "import {chromium} from 'playwright-core'; console.log(chromium.executablePath())")
          node tests/browser/workflows.mjs https://symonyeal.github.io/Canada-Regional-Profiles/ live-workflows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-workflows
          path: live-workflows.json
          if-no-files-found: error
