[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["slow: needs the fetched source files in data/fetched"]

[tool.ruff]
line-length = 130

[tool.ruff.lint]
# E501 is not in ruff's default selection; select it so line-length is enforced.
extend-select = ["E501"]
# E741 rejects l, I and O as names; the sources use them as symbols.
# I001 wraps imports one name per line, against the compact register of these files.
# E701/E702 reject one-line bodies, which the algorithm-box register uses.
ignore = ["E741", "I001", "E701", "E702", "E731"]
